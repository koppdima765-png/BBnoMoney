name: BBno$

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может запаздывать)
  workflow_dispatch:          # ручной запуск кнопкой

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write             # чтобы сохранять seen.json обратно в репозиторий

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -X theirs origin main && git push)
